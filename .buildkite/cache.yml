caches:
  - name: go_build
    cache_key:
      - agent: os
      - {agent: arch, fallback_limit: true}
      - env: BUILDKITE_STEP_KEY
      - env: BUILDKITE_BRANCH
      - env: BUILDKITE_COMMIT
    target_paths:
      - /root/.cache/go-build
  - name: go_mod
    cache_key:
      - agent: os
      - {agent: arch, fallback_limit: true}
      - checksum: go.mod
    target_paths:
      - /root/.cache/go-mod
  - name: golangci_lint
    cache_key:
      - agent: os
      - {agent: arch, fallback_limit: true}
      - env: BUILDKITE_BRANCH
      - env: BUILDKITE_COMMIT
    target_paths:
      - /root/.cache/golangci-lint
